---
name: Diagnose cosign verification

# Manual diagnostic. The promotion gate in projectbluefin/actions runs
# `cosign verify` with its output discarded, so a failure only reads "failed".
# This repeats the same check with the output visible, after logging in the same
# way the gate does (skopeo login), and again after `cosign login`, to show
# whether the failure is about registry access or about the signature.
# Delete this file once the gate passes.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    name: Diagnose cosign verification
    runs-on: ubuntu-latest
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in the way the gate does (skopeo login)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | skopeo login ghcr.io --username "${ACTOR}" --password-stdin

      - name: Where credentials landed (file names only, never contents)
        shell: bash
        run: |
          set -uo pipefail
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-<unset>}"
          echo "DOCKER_CONFIG=${DOCKER_CONFIG:-<unset>}"
          echo "REGISTRY_AUTH_FILE=${REGISTRY_AUTH_FILE:-<unset>}"
          ls -l "${XDG_RUNTIME_DIR:-/nonexistent}/containers/auth.json" 2>&1 || true
          ls -l "${HOME}/.docker/config.json" 2>&1 || true
          cosign version | grep -i gitversion

      - name: Resolve the :testing digest
        id: resolve
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${OWNER,,}/${REPO,,}"
          digest="$(skopeo inspect --format '{{.Digest}}' "docker://${ref}:testing")"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${ref}:testing to ${digest}"

      - name: Verify with only the skopeo login (what the gate does), output visible
        shell: bash
        env:
          REF: ${{ steps.resolve.outputs.ref }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          IDENTITY_REGEXP: ^https://github\.com/${{ github.repository }}/\.github/workflows/
        run: |
          set -uo pipefail
          cosign verify \
            --certificate-identity-regexp "${IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${REF}@${DIGEST}" 2>&1 | cut -c1-600
          echo "cosign exit status: ${PIPESTATUS[0]}"

      - name: Verify again after cosign login, output visible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REF: ${{ steps.resolve.outputs.ref }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          IDENTITY_REGEXP: ^https://github\.com/${{ github.repository }}/\.github/workflows/
        run: |
          set -uo pipefail
          echo "$GH_TOKEN" | cosign login ghcr.io --username "${ACTOR}" --password-stdin
          cosign verify \
            --certificate-identity-regexp "${IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${REF}@${DIGEST}" 2>&1 | cut -c1-600
          echo "cosign exit status: ${PIPESTATUS[0]}"
