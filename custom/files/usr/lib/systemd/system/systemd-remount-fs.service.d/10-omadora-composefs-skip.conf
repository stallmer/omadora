# On a composefs system / is a read-only overlay, and systemd-remount-fs fails
# with "overlay: No changes allowed in reconfigure" when /etc/fstab (written by
# the Anaconda installer) has a root entry to apply. The failure leaves the system
# in the "degraded" state with nothing else wrong. Skip the unit when / is not
# writable; on a writable root it still runs.
# See https://github.com/projectbluefin/utah/issues/585 for the same failure.
[Unit]
ConditionPathIsReadWrite=/
